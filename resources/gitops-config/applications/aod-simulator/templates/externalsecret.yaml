apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.pullSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aod-simulator
    app.kubernetes.io/component: secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: {{ .Values.pullSecret.name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .Values.pullSecret.username }}","password":"{{ "{{ .token }}" }}"}}}'
  data:
  - secretKey: token
    remoteRef:
      key: {{ .Values.pullSecret.remoteKey }}
      property: {{ .Values.pullSecret.property }}
