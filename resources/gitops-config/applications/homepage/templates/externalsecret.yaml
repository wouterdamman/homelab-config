---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-authentik-outpost-token
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: {{ .Values.authentikOutpost.externalSecret.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: homepage-authentik-outpost-token
  data:
  - secretKey: token
    remoteRef:
      key: {{ .Values.authentikOutpost.externalSecret.remoteKey }}
      property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-secrets
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: {{ .Values.widgetSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: homepage-secrets
    template:
      engineVersion: v2
      data:
        # "Proxmox - Automation Account".api_key holds "tokenid=secret"
        # (e.g. automation@pve!tofu=<uuid>) — tokenId itself is not secret
        # (hardcoded in values.yaml services.yaml), only the part after "=" is.
        HOMEPAGE_VAR_PROXMOX_TOKEN: '{{ `{{ index (splitn "=" 2 .proxmoxApiKey) "_1" }}` }}'
        HOMEPAGE_VAR_ADGUARD_USER: '{{ `{{ .adguardUser }}` }}'
        HOMEPAGE_VAR_ADGUARD_PASSWORD: '{{ `{{ .adguardPassword }}` }}'
        HOMEPAGE_VAR_ARGOCD_TOKEN: '{{ `{{ .argocdToken }}` }}'
        HOMEPAGE_VAR_GRAFANA_USER: '{{ `{{ .grafanaUser }}` }}'
        HOMEPAGE_VAR_GRAFANA_PASSWORD: '{{ `{{ .grafanaPassword }}` }}'
        HOMEPAGE_VAR_AUTHENTIK_TOKEN: '{{ `{{ .authentikToken }}` }}'
        HOMEPAGE_VAR_HOMEASSISTANT_TOKEN: '{{ `{{ .homeassistantToken }}` }}'
  data:
  - secretKey: proxmoxApiKey
    remoteRef:
      key: {{ .Values.widgetSecrets.proxmox.remoteKey }}
      property: api_key
  - secretKey: adguardUser
    remoteRef:
      key: {{ .Values.widgetSecrets.adguard.remoteKey }}
      property: username
  - secretKey: adguardPassword
    remoteRef:
      key: {{ .Values.widgetSecrets.adguard.remoteKey }}
      property: password
  - secretKey: argocdToken
    remoteRef:
      key: {{ .Values.widgetSecrets.argocd.remoteKey }}
      property: token
  - secretKey: grafanaUser
    remoteRef:
      key: {{ .Values.widgetSecrets.grafana.remoteKey }}
      property: username
  - secretKey: grafanaPassword
    remoteRef:
      key: {{ .Values.widgetSecrets.grafana.remoteKey }}
      property: password
  - secretKey: authentikToken
    remoteRef:
      key: {{ .Values.widgetSecrets.authentik.remoteKey }}
      property: token
  - secretKey: homeassistantToken
    remoteRef:
      key: {{ .Values.widgetSecrets.homeassistant.remoteKey }}
      property: token
