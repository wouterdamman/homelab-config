---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homepage-outpost
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homepage
      app.kubernetes.io/component: authentik-outpost

  ingress:
  # Web UI — from app-gateway
  - fromEntities:
    - cluster
    toPorts:
    - ports:
      - port: "9000"
        protocol: TCP
      - port: "9443"
        protocol: TCP

  egress:
  # DNS
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP

  # Authentik server (auth checks, websocket)
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: authentik
        app.kubernetes.io/name: authentik
    toPorts:
    - ports:
      - port: "9000"
        protocol: TCP

  # Proxied app itself
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: homepage
        app.kubernetes.io/component: web
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homepage-app
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homepage
      app.kubernetes.io/component: web

  ingress:
  # Only the outpost may reach the app directly
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: homepage
        app.kubernetes.io/component: authentik-outpost
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP

  egress:
  # DNS
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP

  # kube-apiserver — Gateway API HTTPRoute reads (health checks / future discovery)
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP

  # In-cluster widget/link targets reached via a gateway (Cilium sees the
  # gateway LB IPs as "world"): Proxmox (8006), AdGuard x2 (80), ArgoCD,
  # Grafana, Longhorn, Hubble, Authentik, NetBox etc. (443/80 via gateways).
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "8006"
        protocol: TCP
      - port: "80"
        protocol: TCP
      - port: "443"
        protocol: TCP
