replicaCount: 1

image:
  repository: ghcr.io/gethomepage/homepage
  tag: v1.13.2
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  timeZone: "Europe/Amsterdam"

  settingsYaml: |
    title: Damman Homelab
    headerStyle: boxed
    theme: dark
    color: slate
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      hideVisitURL: false
    layout:
      Operators:
        style: row
        columns: 4
      Infrastructuur:
        style: row
        columns: 4
      Smart Home:
        style: row
        columns: 4
      Apps:
        style: row
        columns: 4

  bookmarksYaml: |
    []

  # widgets.yaml — top-of-page info widgets (no group)
  # NOTE: openmeteo latitude/longitude below is a placeholder (Amsterdam
  # city center) — adjust to your actual location for accurate weather.
  widgetsYaml: |
    - search:
        provider: google
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: false
    - openmeteo:
        label: Thuis
        latitude: 52.3676
        longitude: 4.9041
        timezone: Europe/Amsterdam
        units: metric
        cache: 5

  # services.yaml — full dashboard. Widget entries pull secrets via
  # {{HOMEPAGE_VAR_*}} substitution, populated from the homepage-secrets
  # ExternalSecret (see templates/externalsecret.yaml).
  servicesYaml: |
    - Operators:
        - ArgoCD:
            href: https://argocd.svc.damman.tech
            description: GitOps sync status
            icon: argo-cd.png
            widget:
              type: argocd
              url: http://argo-cd-argocd-server.argocd.svc.cluster.local
              key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
              fields: ["apps", "synced", "healthy", "outOfSync"]
        - Grafana:
            href: https://grafana.svc.damman.tech
            description: Metrics & dashboards
            icon: grafana.png
            widget:
              type: grafana
              url: http://prometheus-community-grafana.monitoring.svc.cluster.local
              username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
              fields: ["dashboards", "alertstriggered"]
        - Longhorn:
            href: https://longhorn.svc.damman.tech
            description: Distributed storage
            icon: longhorn.png
            siteMonitor: https://longhorn.svc.damman.tech
        - Hubble:
            href: https://hubble.svc.damman.tech
            description: Cilium network observability
            icon: cilium.png
            siteMonitor: https://hubble.svc.damman.tech
        - Authentik:
            href: https://sso.svc.damman.tech/if/user/
            description: SSO / identity provider
            icon: authentik.png
            widget:
              type: authentik
              url: http://authentik-server.authentik.svc.cluster.local
              key: "{{HOMEPAGE_VAR_AUTHENTIK_TOKEN}}"
              version: 2
              fields: ["users", "loginsLast24H", "failedLoginsLast24H"]

    - Infrastructuur:
        - Proxmox VE:
            href: https://pve.svc.damman.tech:8006
            description: Hypervisor
            icon: proxmox.png
            widget:
              type: proxmox
              url: https://pve.svc.damman.tech:8006
              username: "automation@pve!tofu"
              password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
        - AdGuard Home:
            href: https://adguard.svc.damman.tech
            description: DNS / ad-blocking
            icon: adguard-home.png
            widget:
              type: adguard
              url: https://adguard.svc.damman.tech
              username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
              password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
        - AdGuard Kids:
            href: https://kids-adguard.svc.damman.tech
            description: DNS / ad-blocking (kids)
            icon: adguard-home.png
            widget:
              type: adguard
              url: https://kids-adguard.svc.damman.tech
              username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
              password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
        - NetBox:
            href: https://netbox.svc.damman.tech
            description: IPAM / DCIM (uitgeschakeld)
            icon: netbox.png
            siteMonitor: https://netbox.svc.damman.tech

    - Smart Home:
        - Home Assistant:
            href: https://ha.app.damman.tech
            description: Smart home hub
            icon: home-assistant.png
            widget:
              type: homeassistant
              url: http://home-assistant.home-assistant.svc.cluster.local:8123
              key: "{{HOMEPAGE_VAR_HOMEASSISTANT_TOKEN}}"
        - EVCC:
            href: https://evcc.app.damman.tech
            description: Solar EV charging
            icon: evcc.png
            widget:
              type: evcc
              url: http://evcc.evcc.svc.cluster.local:7070
        - Zigbee2MQTT:
            href: https://zigbee.svc.damman.tech
            description: Zigbee gateway
            icon: zigbee2mqtt.png
            siteMonitor: https://zigbee.svc.damman.tech
        - EMQX:
            href: https://emqx.svc.damman.tech
            description: MQTT broker
            icon: emqx.png
            siteMonitor: https://emqx.svc.damman.tech

    - Apps:
        - Home Finance:
            href: https://budget.app.damman.tech
            description: Personal finance (eigen build)
            icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/nextcloud-cospend.png
            siteMonitor: https://budget.app.damman.tech
        - Code-server:
            href: https://codeserver.svc.damman.tech
            description: Dev environment
            icon: vscode.png
            siteMonitor: https://codeserver.svc.damman.tech
        - LucidVault:
            description: AI knowledge vault
            icon: obsidian.png
            siteMonitor: https://lucidvault.svc.damman.tech

  dockerYaml: |
    {}

  kubernetesYaml: |
    mode: cluster

  customCss: |
    /* Slightly softer corners on service cards */
    .services-group .rounded-md {
      border-radius: 0.75rem;
    }

  customJs: |
    // Reserved for future dashboard tweaks.

authentikOutpost:
  image:
    repository: ghcr.io/goauthentik/proxy
    tag: "2026.5.6"
  authentikHost: "http://authentik-server.authentik.svc"
  authentikHostBrowser: "https://sso.app.damman.tech"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  externalSecret:
    secretStoreRef: onepassword-connect
    remoteKey: authentik-outpost-homepage

widgetSecrets:
  secretStoreRef: onepassword-connect
  proxmox:
    remoteKey: "Proxmox - Automation Account"
  adguard:
    remoteKey: Adguard
  argocd:
    remoteKey: homepage-argocd
  grafana:
    remoteKey: grafana-admin
  authentik:
    remoteKey: homepage-authentik-api
  homeassistant:
    remoteKey: homepage-homeassistant

httproutes:
- enabled: true
  name: homepage-httproute
  namespace: homepage
  hostname: homepage.app.damman.tech
  path: /
  gateway:
    name: app-gateway
    namespace: kube-system
    sectionName: app-https-listener
  backend:
    name: homepage-authentik-outpost
    port: 9000
