---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard-kids-httproute
  namespace: infrastructure
  annotations:
    external-dns.alpha.kubernetes.io/hostname: kids-adguard.svc.damman.tech
  labels:
    app.kubernetes.io/name: adguard-kids
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: svc-gateway
      namespace: kube-system
      sectionName: svc-https-listener
  hostnames:
    - kids-adguard.svc.damman.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: adguard-kids
          port: 80
