---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard-httproute
  namespace: infrastructure
  annotations:
    external-dns.alpha.kubernetes.io/hostname: adguard.svc.damman.tech
  labels:
    app.kubernetes.io/name: adguard
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: svc-gateway
      namespace: kube-system
      sectionName: svc-https-listener
  hostnames:
    - adguard.svc.damman.tech
  rules:
    - backendRefs:
        - name: adguard
          port: 80
