apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: prometheus-pve-exporter-scrape
  namespace: monitoring
spec:
  endpoints:
    # 10.0.10.201 removed: confirmed dead (ConnectTimeout in exporter logs),
    # only 10.0.10.200 is a live PVE node.
    - port: http
      interval: 60s
      path: /pve
      params:
        target: ['10.0.10.200']
        module: ['default']
      relabelConfigs:
        - action: replace
          sourceLabels:
            - __param_target
          targetLabel: instance
        - action: replace
          replacement: prometheus-pve-exporter:80
          targetLabel: __address__
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-pve-exporter
      app.kubernetes.io/instance: prometheus-pve-exporter
