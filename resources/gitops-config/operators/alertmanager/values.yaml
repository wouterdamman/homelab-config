# Alertmanager values (standalone chart, split out of kube-prometheus-stack)
# Docs: https://github.com/prometheus-community/helm-charts/tree/main/charts/alertmanager

# Service is alertmanager.monitoring:9093, pod alertmanager-0
fullnameOverride: alertmanager

replicaCount: 1

persistence:
  enabled: true
  storageClass: longhorn-standard
  size: 2Gi

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

configmapReload:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi

tolerations:
- key: node-role.kubernetes.io/control-plane
  operator: Equal
  value: "true"
  effect: NoSchedule

serviceMonitor:
  enabled: true

# Secrets are mounted outside /etc/alertmanager, which is a read-only ConfigMap mount
extraSecretMounts:
- name: pushover
  mountPath: /etc/alertmanager-secrets/pushover
  secretName: alertmanager-pushover
  readOnly: true
- name: healthchecks
  mountPath: /etc/alertmanager-secrets/healthchecks
  secretName: alertmanager-healthchecks
  readOnly: true

config:
  global:
    resolve_timeout: 5m

  route:
    group_by: [ 'alertname', 'namespace' ]
    group_wait: 30s
    group_interval: 5m
    # 24h fallback for anything that matches no sub-route below
    repeat_interval: 24h
    receiver: 'pushover-warning'
    routes:
    # Watchdog pings healthchecks.io every 30m as dead man's switch
    - receiver: 'healthchecks-watchdog'
      repeat_interval: 30m
      matchers:
      - alertname = "Watchdog"
    # InfoInhibitor goes to null
    - receiver: 'null'
      matchers:
      - alertname = "InfoInhibitor"
    # Critical alerts — keep re-paging every 4h, unlike warnings
    - receiver: 'pushover-critical'
      repeat_interval: 4h
      matchers:
      - severity = "critical"
    # Warning alerts (default) — 24h reduces alert fatigue for sustained slow-burn issues
    - receiver: 'pushover-warning'
      repeat_interval: 24h
      matchers:
      - severity = "warning"

  receivers:
  # Dead man's switch — pings healthchecks.io every 30m; silence = monitoring down
  - name: 'healthchecks-watchdog'
    webhook_configs:
    - url_file: /etc/alertmanager-secrets/healthchecks/ping-url
      send_resolved: false

  # Null receiver for alerts we don't want to send
  - name: 'null'

  - name: 'pushover-critical'
    pushover_configs:
    - user_key_file: /etc/alertmanager-secrets/pushover/user-key
      token_file: /etc/alertmanager-secrets/pushover/api-token
      priority: 1
      title: '{{ template "pushover.title" . }}'
      message: '{{ template "pushover.message" . }}'

  - name: 'pushover-warning'
    pushover_configs:
    - user_key_file: /etc/alertmanager-secrets/pushover/user-key
      token_file: /etc/alertmanager-secrets/pushover/api-token
      priority: 0
      title: '{{ template "pushover.title" . }}'
      message: '{{ template "pushover.message" . }}'

  templates:
  - '/etc/alertmanager/*.tmpl'

templates:
  pushover.tmpl: |-
    {{ define "pushover.title" }}[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}{{ end }}
    {{ define "pushover.message" }}{{ range .Alerts }}{{ .Annotations.summary }}
    {{ .Annotations.description }}
    {{ end }}{{ end }}
