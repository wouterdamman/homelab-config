---
# Alerts on CNPG scheduled-backup failures.
#
# CNPG's Prometheus collector (cnpg_collector_last_available_backup_timestamp)
# is not updated for plugin-based (barman-cloud) backups, so a PrometheusRule
# built on it can never resolve.
#
# The Cluster's LastBackupSucceeded condition is NOT used here: it flips to
# False the moment a backup *starts* (not just on actual failure), so polling
# it produces a false FAIL/RECOVER pair on every single scheduled backup run.
# Instead this job reads the phase of the most recent Backup CR directly
# (running/completed/failed) — the same object the weekly backup-validation
# job creates. "running" is skipped entirely so an in-progress backup never
# triggers an alert. Only notifies on a completed<->failed transition, to
# avoid repeat-spam between scheduled backup attempts.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-backup-alert-check
  namespace: cnpg-system
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: cnpg-backup-validation
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: alpine/k8s:1.37.0
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PUSHOVER_USER
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-backup-validation-pushover
                      key: user-key
                - name: PUSHOVER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-backup-validation-pushover
                      key: api-token
              command:
                - /bin/bash
                - -c
                - |
                  set -e

                  STATE_CM="cnpg-backup-alert-state"
                  NAMESPACE="cnpg-system"

                  send_pushover() {
                    local title="$1"
                    local message="$2"
                    local priority="$3"
                    curl -s -X POST https://api.pushover.net/1/messages.json \
                      -d "token=${PUSHOVER_TOKEN}" \
                      -d "user=${PUSHOVER_USER}" \
                      -d "title=${title}" \
                      -d "message=${message}" \
                      -d "priority=${priority}" > /dev/null
                  }

                  # Ensure the state ConfigMap exists (first run: no prior state, no notification)
                  if ! kubectl get configmap "$STATE_CM" -n "$NAMESPACE" >/dev/null 2>&1; then
                    kubectl create configmap "$STATE_CM" -n "$NAMESPACE"
                  fi

                  for cluster in shared homeassistant; do
                    LATEST=$(kubectl get backups.postgresql.cnpg.io -n "$NAMESPACE" \
                      -l "cnpg.io/cluster=cnpg-${cluster}" \
                      --sort-by=.metadata.creationTimestamp \
                      -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.phase}{"\n"}{end}' \
                      | tail -1)

                    if [ -z "$LATEST" ]; then
                      echo "cnpg-${cluster}: no backups yet, skipping"
                      continue
                    fi

                    LATEST_NAME=$(echo "$LATEST" | cut -f1)
                    LATEST_PHASE=$(echo "$LATEST" | cut -f2)

                    if [ "$LATEST_PHASE" = "running" ]; then
                      echo "cnpg-${cluster}: backup in progress, skipping"
                      continue
                    fi

                    if [ "$LATEST_PHASE" = "failed" ]; then
                      CURRENT="False"
                      MESSAGE=$(kubectl get backups.postgresql.cnpg.io "$LATEST_NAME" -n "$NAMESPACE" \
                        -o jsonpath='{.status.error}')
                    else
                      CURRENT="True"
                      MESSAGE="Backup was successful"
                    fi

                    PREVIOUS=$(kubectl get configmap "$STATE_CM" -n "$NAMESPACE" \
                      -o jsonpath="{.data.${cluster}}" 2>/dev/null || echo "")

                    echo "cnpg-${cluster}: previous=${PREVIOUS:-<none>} current=${CURRENT}"

                    if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$CURRENT" ]; then
                      if [ "$CURRENT" = "False" ]; then
                        send_pushover \
                          "❌ cnpg-${cluster} — Backup FAILED" \
                          "$MESSAGE" \
                          "1"
                      else
                        send_pushover \
                          "✅ cnpg-${cluster} — Backup recovered" \
                          "Backups are succeeding again." \
                          "-1"
                      fi
                    fi

                    kubectl patch configmap "$STATE_CM" -n "$NAMESPACE" \
                      --type merge -p "{\"data\":{\"${cluster}\":\"${CURRENT}\"}}"
                  done
