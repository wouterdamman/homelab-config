apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-homeassistant
  namespace: cnpg-system
spec:
  description: "Dedicated PostgreSQL cluster for Home Assistant"
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  instances: 2

  # Keep the Longhorn snapshot and backup jobs off the PG volumes. With this
  # label on the PVC, Longhorn takes the volume's recurring-job groups from
  # the PVC (none) instead of the StorageClass. Postgres rewrites pages all
  # the time, so hourly snapshots grew past the volume size, and barman
  # already ships base backups and WAL to S3.
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled

  # PostgreSQL configuration - optimized for Home Assistant recorder
  postgresql:
    parameters:
      shared_buffers: "128MB"
      effective_cache_size: "384MB"
      maintenance_work_mem: "64MB"
      max_connections: "50"
      log_statement: "ddl"
      log_min_duration_statement: "1000"
      synchronous_commit: "off"
      wal_writer_delay: "200ms"
    pg_hba:
      - host all all 10.0.0.0/8 scram-sha-256
      - host all all 192.168.0.0/16 scram-sha-256

  # Bootstrap with databases
  bootstrap:
    initdb:
      database: homeassistant
      owner: homeassistant
      secret:
        name: cnpg-homeassistant-app

  # Superuser secret reference
  superuserSecret:
    name: cnpg-homeassistant-superuser

  # Storage configuration - larger for Home Assistant history
  storage:
    storageClass: longhorn-standard
    size: 10Gi

  # Resource configuration
  resources:
    requests:
      cpu: "200m"
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # Backup via barman-cloud plugin (ObjectStore: cnpg-homeassistant-backup)
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    enabled: true
    isWALArchiver: true
    parameters:
      barmanObjectName: cnpg-homeassistant-backup

  # Monitoring
  monitoring:
    enablePodMonitor: true
    podMonitorMetricRelabelings:
      - action: replace
        sourceLabels: [cluster]
        targetLabel: cnpg_cluster

  # Liveness: tolerate a slow API server. All VMs share one Proxmox host; when
  # it saturates, etcd/API latency spikes past the default 1s isolation-check
  # timeouts and the kubelet kills a healthy primary, forcing a failover.
  # A Talos worker upgrade on 2026-10-26 stalled etcd for ~70s (slow fdatasync
  # on the shared NVMe), so allow ~3 minutes of failed checks before a restart.
  probes:
    liveness:
      timeoutSeconds: 10
      failureThreshold: 18
      isolationCheck:
        enabled: true
        connectionTimeout: 5000
        requestTimeout: 5000

  # Smart shutdown waits for every client (pooler, apps) to disconnect. Keep it
  # short so a restarting primary moves on to a fast shutdown instead of hanging.
  smartShutdownTimeout: 15

  # Affinity - prefer different nodes for replicas
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
