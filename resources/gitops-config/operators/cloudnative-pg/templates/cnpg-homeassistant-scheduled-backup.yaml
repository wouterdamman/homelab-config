---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-homeassistant-6h-backup
  namespace: cnpg-system
spec:
  # Reference to the cluster
  cluster:
    name: cnpg-homeassistant

  # Daily at 00:00 UTC. Was every 6 hours, which kept 4x as many base
  # backups in S3 (27.8 GB against 3.5 GB for cnpg-shared). WAL archiving is
  # continuous, so point-in-time recovery stays possible; a restore only
  # replays more WAL. The name keeps "6h": renaming would recreate the
  # ScheduledBackup and garbage-collect the Backup objects it owns.
  # Format: second minute hour day month dayofweek
  schedule: "0 0 0 * * *"

  # Backup configuration
  backupOwnerReference: self
  immediate: false
  suspend: false
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

  # Target for backup (prefer standby to reduce primary load)
  target: prefer-standby
