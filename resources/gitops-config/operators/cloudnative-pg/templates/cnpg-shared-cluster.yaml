apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-shared
  namespace: cnpg-system
spec:
  description: "Shared PostgreSQL cluster for small applications"
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  instances: 2

  # PostgreSQL configuration
  postgresql:
    parameters:
      shared_buffers: "64MB"
      effective_cache_size: "192MB"
      maintenance_work_mem: "32MB"
      max_connections: "100"
      log_statement: "ddl"
      log_min_duration_statement: "1000"
    pg_hba:
      - host all all 10.0.0.0/8 scram-sha-256
      - host all all 192.168.0.0/16 scram-sha-256

  # Bootstrap with superuser from ExternalSecret
  # Note: Database and user initialization is handled by GitOps jobs (cnpg-init-*.yaml)
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: cnpg-shared-superuser

  # Superuser secret reference
  superuserSecret:
    name: cnpg-shared-superuser

  # Storage configuration
  storage:
    storageClass: longhorn-fast
    size: 5Gi

  # Resource configuration
  # Working set reached ~490Mi of a 512Mi limit on 2026-10-22; give headroom.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Backup via barman-cloud plugin (ObjectStore: cnpg-shared-backup)
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    enabled: true
    isWALArchiver: true
    parameters:
      barmanObjectName: cnpg-shared-backup

  # Monitoring
  monitoring:
    enablePodMonitor: true
    podMonitorMetricRelabelings:
      - action: replace
        sourceLabels: [cluster]
        targetLabel: cnpg_cluster

  # Role management - CNPG sets passwords directly from secrets, no shell interpolation
  managed:
    roles:
      - name: authentik
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: cnpg-shared-authentik
      - name: homefinance
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: cnpg-shared-home-finance
      - name: netbox
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: cnpg-shared-netbox

  # Liveness: tolerate a slow API server. All VMs share one Proxmox host; when
  # it saturates, etcd/API latency spikes past the default 1s isolation-check
  # timeouts and the kubelet kills a healthy primary, forcing a failover.
  probes:
    liveness:
      timeoutSeconds: 10
      failureThreshold: 6
      isolationCheck:
        enabled: true
        connectionTimeout: 5000
        requestTimeout: 5000

  # Affinity - prefer different nodes for replicas
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
