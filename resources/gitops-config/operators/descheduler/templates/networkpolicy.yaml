apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: descheduler
  namespace: descheduler
spec:
  endpointSelector: {}

  ingress:
  # Prometheus scraping (metrics on the HTTPS health port)
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: "10258"
        protocol: TCP

  egress:
  # DNS
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP

  # kube-apiserver — list nodes/pods, evict pods
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
