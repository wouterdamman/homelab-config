# Descheduler: moves pods off busy nodes after a reboot or upgrade, so the
# scheduler can place them on the emptied node. It only evicts (through the
# eviction API, so PDBs apply); the default scheduler picks the new node.

# Long-running Deployment instead of the chart's 2-minute CronJob.
kind: Deployment
deschedulingInterval: 30m

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

# PSS restricted
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

deschedulerPolicy:
  # Workers only. The control planes are tainted and run a fixed set of pods;
  # with them in the pool LowNodeUtilization could classify one as
  # underutilized and evict pods that tolerate the taint (Prometheus, ArgoCD).
  nodeSelector: "!node-role.kubernetes.io/control-plane"
  # Per run, so a rebalance happens in small steps. All moves come off the
  # busiest node, so the per-node cap equals the total.
  maxNoOfPodsToEvictPerNode: 5
  maxNoOfPodsToEvictTotal: 5
  profiles:
    - name: default
      pluginConfig:
        - name: DefaultEvictor
          args:
            # Only evict a pod when another node can actually take it.
            nodeFit: true
            # Pods with a PVC (Home Assistant, CNPG, emqx, zigbee2mqtt,
            # lucidvault, Grafana, Loki, Prometheus) stay put.
            podProtections:
              # emptyDir is scratch space (tmp dirs for read-only root
              # filesystems); losing it on a move is fine.
              defaultDisabled:
                - PodsWithLocalStorage
              extraEnabled:
                - PodsWithPVC
        - name: RemoveDuplicates
          args:
            namespaces: &excluded
              exclude:
                - kube-system
                - longhorn-system
                - cnpg-system
                - home-assistant
                - emqx
                - zigbee2mqtt
                - home-finance
        - name: RemovePodsViolatingTopologySpreadConstraint
          args:
            namespaces: *excluded
        # Percentages of allocatable, based on pod requests (like the scheduler).
        # Underutilized: below all thresholds. Overutilized: above any target.
        # The DaemonSets alone put a worker at about 30% CPU requests, so a
        # freshly rebooted worker sat at 40% and never counted as
        # underutilized with cpu: 35 (2026-10-30, 14/42/39 pods for hours).
        - name: LowNodeUtilization
          args:
            thresholds:
              cpu: 50
              memory: 35
              pods: 30
            targetThresholds:
              cpu: 60
              memory: 45
              pods: 35
            evictableNamespaces: *excluded
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - RemovePodsViolatingTopologySpreadConstraint
            - LowNodeUtilization
