# external-dns values
# Docs: https://kubernetes-sigs.github.io/external-dns/

fullnameOverride: "external-dns-unifi"

logLevel: info  # Changed from debug for less noise
logFormat: text

interval: 1m
triggerLoopOnEvent: true

namespaced: false

domainFilters:
  - local.damman.tech
  - svc.damman.tech
  - app.damman.tech

sources:
  - crd
  - service
  - ingress
  - gateway-httproute
  # gateway-tlsroute disabled: upstream external-dns only supports TLSRoute
  # v1alpha2, which the Gateway API CRD no longer serves (v1-only since the
  # 2026-08-04 CRD upgrade). Re-enable once external-dns adds v1 support.

policy: sync

registry: txt
txtOwnerId: "talos-prd"
txtPrefix: "talos."
txtSuffix: ""

# Resource limits
resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

provider:
  name: webhook
  webhook:
    # Repo moved kashalls -> home-operations (same project, transferred); release
    # tags dropped the 'v' prefix at 0.10.0.
    image:
      repository: 'ghcr.io/home-operations/external-dns-unifi-webhook'
      tag: 0.10.12
      digest: sha256:5338b99662e2e15048b4e14b49e17279d384970fdcb3c29169f509f806f49cbe
      pullPolicy: IfNotPresent
    env:
      - name: UNIFI_HOST
        value: https://10.0.10.193
      - name: UNIFI_API_KEY
        valueFrom:
          secretKeyRef:
            name: external-dns-unifi-secret
            key: api-key
      - name: LOG_LEVEL
        value: info
    livenessProbe:
      httpGet:
        path: /healthz
        port: http-webhook
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 2
      successThreshold: 1
    readinessProbe:
      httpGet:
        path: /healthz
        port: http-webhook
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    service:
      port: 8080
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi

extraArgs:
  - --ignore-ingress-tls-spec

# Prometheus metrics
serviceMonitor:
  enabled: true
  additionalLabels:
    release: prometheus
