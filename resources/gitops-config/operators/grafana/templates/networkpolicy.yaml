# Grafana — serves dashboard UI, reads from VictoriaMetrics + VictoriaLogs
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
  - fromEntities:
    - cluster
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app.kubernetes.io/name: vmsingle
    toPorts:
    - ports:
      - port: "8428"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app.kubernetes.io/name: vlsingle
    toPorts:
    - ports:
      - port: "9428"
        protocol: TCP
  # Authentik OIDC token + userinfo — server-side calls via internal service (LB IP is cluster-entity)
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: authentik
        app.kubernetes.io/name: authentik
    toPorts:
    - ports:
      - port: "9000"
        protocol: TCP
  # kube-apiserver — grafana-sc-dashboard + grafana-sc-datasources sidecars watch ConfigMaps/Secrets
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  # Grafana plugin downloads
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
