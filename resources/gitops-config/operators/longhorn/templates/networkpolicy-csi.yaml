---
# longhorn-csi-plugin — kubelet talks to it via Unix socket (no network rule needed for that),
# but healthz (9808) is polled over network, and it calls longhorn-manager's API for volume ops.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-csi-plugin
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-csi-plugin
  ingress:
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: "9808"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app: longhorn-manager
    toPorts:
    - ports:
      - port: "9500"
        protocol: TCP

---
# longhorn-driver-deployer — registers CSI driver objects, calls longhorn-manager API
apiVersion: cilium.io/v2
