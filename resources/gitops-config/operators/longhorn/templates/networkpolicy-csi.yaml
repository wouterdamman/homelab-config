        protocol: TCP

---
# engine-image — image-pulling DaemonSet only, no listening process, shares binaries via hostPath.
# No ingress needed. DNS egress kept minimal/defensive.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-engine-image
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      longhorn.io/component: engine-image
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
