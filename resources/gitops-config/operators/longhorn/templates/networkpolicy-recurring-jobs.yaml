# Recurring backup/snapshot Jobs — ephemeral pods spawned by CronJobs, call longhorn-manager API only
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-recurring-jobs
  namespace: longhorn-system
spec:
  endpointSelector:
    matchExpressions:
    - key: recurring-job.longhorn.io
      operator: Exists
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app: longhorn-manager
    toPorts:
    - ports:
      - port: "9500"
        protocol: TCP
