apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-backups
  namespace: longhorn-system
  labels:
    release: prometheus
spec:
  groups:
    - name: longhorn-backups
      interval: 5m
      rules:

        - alert: LonghornVolumeBackupTooOld
          # Fast and standard volumes get a daily backup. From May to
          # 2026-10-27 none were made (jobs without groups, then a CNP that
          # blocked manager-to-manager traffic) and nothing alerted. A volume
          # that was never backed up reports 0, so it fires as well.
          # longhorn-monitoring and longhorn-archive volumes are left out
          # (no backups, weekly backups), and so are the CNPG volumes, which
          # barman backs up instead.
          expr: |
            (time() - max by (volume, pvc, pvc_namespace) (longhorn_volume_last_backup_at{pvc_namespace!="cnpg-system"})) > 36 * 3600
            and on (pvc, pvc_namespace)
            label_replace(
              label_replace(
                kube_persistentvolumeclaim_info{storageclass=~"longhorn-(fast|standard)"},
                "pvc", "$1", "persistentvolumeclaim", "(.*)"),
              "pvc_namespace", "$1", "namespace", "(.*)")
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No Longhorn backup of {{`{{`}} $labels.pvc_namespace {{`}}`}}/{{`{{`}} $labels.pvc {{`}}`}} in 36h"
            description: "The last backup of volume {{`{{`}} $labels.volume {{`}}`}} is older than 36 hours (or there is none). Check the backup-daily-* jobs and the longhorn-manager logs."
