---
# Jobs only run for volumes in their groups. Volumes join a group through the
# StorageClass recurringJobSelector (new volumes) or the Longhorn volume label
# recurring-job-group.longhorn.io/<group>=enabled. Without groups no volume
# was backed up from May to 2026-10-27. CNPG PVCs opt out through the
# recurring-job.longhorn.io/source label (see the CNPG Cluster manifests).
#
# Everything except the hourly snapshot runs at :30, so it never overlaps
# with it, and backups run one volume at a time. Everything runs on one
# Proxmox host; parallel backups at 02:00/04:00 coincided with etcd heartbeat
# warnings.
#
# Fast Storage Tier - Hourly snapshots + Daily backups
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-hourly-fast
  namespace: longhorn-system
spec:
  name: snapshot-hourly-fast
  task: snapshot
  cron: "0 * * * *"  # Every hour
  retain: 24         # Keep 24 hours
  concurrency: 2
  groups:
    - fast
  labels:
    tier: fast

---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily-fast
  namespace: longhorn-system
spec:
  name: backup-daily-fast
  task: backup
  cron: "30 2 * * *"  # Daily at 02:30
  retain: 30          # Keep 30 days
  concurrency: 1
  groups:
    - fast
  labels:
    tier: fast

---
# Standard Storage Tier - Daily snapshots + Daily backups
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-daily-standard
  namespace: longhorn-system
spec:
  name: snapshot-daily-standard
  task: snapshot
  cron: "30 3 * * *"  # Daily at 03:30
  retain: 7          # Keep 7 days
  concurrency: 2
  groups:
    - standard
  labels:
    tier: standard

---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily-standard
  namespace: longhorn-system
spec:
  name: backup-daily-standard
  task: backup
  cron: "30 4 * * *"  # Daily at 04:30
  retain: 14          # Keep 14 days
  concurrency: 1
  groups:
    - standard
  labels:
    tier: standard

---
# Archive Storage Tier - Weekly snapshots + Weekly backups
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-weekly-archive
  namespace: longhorn-system
spec:
  name: snapshot-weekly-archive
  task: snapshot
  cron: "30 5 * * 0"  # Weekly on Sunday at 05:30
  retain: 4          # Keep 4 weeks
  concurrency: 1
  groups:
    - archive
  labels:
    tier: archive

---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly-archive
  namespace: longhorn-system
spec:
  name: backup-weekly-archive
  task: backup
  cron: "30 6 * * 0"  # Weekly on Sunday at 06:30
  retain: 4          # Keep 4 weeks
  concurrency: 1
  groups:
    - archive
  labels:
    tier: archive

---
# Monthly full backup for all tiers (disaster recovery)
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-monthly-all
  namespace: longhorn-system
spec:
  name: backup-monthly-all
  task: backup
  cron: "30 1 1 * *"  # Monthly on 1st at 01:30
  retain: 12         # Keep 12 months
  concurrency: 1
  groups:
    - fast
    - standard
    - archive
  labels:
    tier: all
    purpose: dr
