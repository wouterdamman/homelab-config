preUpgradeChecker:
  jobEnabled: true

tolerations:
- key: node-role.kubernetes.io/control-plane
  operator: Equal
  value: "true"
  effect: NoSchedule

defaultBackupStore:
  backupTarget: s3://homelab-prd@nbg1/longhorn-backup/
  backupTargetCredentialSecret: longhorn-s3-secret
  pollInterval: 300

defaultSettings:
  backupCompressionMethod: lz4
  backupConcurrentLimit: 2
  restoreConcurrentLimit: 2
  snapshotDataIntegrity: fast
  snapshotDataIntegrityImmediateCheckAfterSnapshotCreation: true
  snapshotMaxCount: 50
  replicaReplenishmentWaitInterval: 600
  replicaAutoBalance: best-effort
  storageMinimalAvailablePercentage: 15
  storageOverProvisioningPercentage: 200
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  nodeDrainPolicy: block-if-contains-last-replica
  guaranteedInstanceManagerCPU: 12
  orphanAutoDeletion: true
  concurrentAutomaticEngineUpgradePerNodeLimit: 1
  concurrentReplicaRebuildPerNodeLimit: 5
  defaultDataLocality: best-effort
  # Workers mount /dev/sdb as the Talos user volume 'longhorn' here (since
  # 2026-10-27); the kubelet sees /var/mnt without extra mounts.
  defaultDataPath: /var/mnt/longhorn

# Requests so the scheduler and descheduler account for Longhorn's own pods
# (sized from kubectl top on 2026-10-27). No limits: throttling or OOM-killing
# the manager stalls volume operations. Instance managers, CSI sidecars and the
# UI have no resources knob in the chart.
longhornManager:
  resources:
    requests:
      cpu: 25m
      memory: 192Mi

longhornGlobalManager:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

# Prometheus metrics
metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus
