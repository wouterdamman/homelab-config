# kube-prometheus-stack values
# Docs: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

# Global settings
fullnameOverride: prometheus

# Prometheus
prometheus:
  prometheusSpec:
    # Discover ServiceMonitor targets via discovery.k8s.io/v1 EndpointSlice instead
    # of core/v1 Endpoints, which is deprecated since Kubernetes 1.33 (cluster runs
    # 1.36) and made client-go log a deprecation warning on every watch.
    serviceDiscoveryRole: EndpointSlice

    retention: 14d
    # Doubled from 30GB alongside scrapeInterval 60s->30s to keep 14d retention intact
    retentionSize: "60GB"

    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-monitoring
          accessModes: [ "ReadWriteOnce" ]
          resources:
            requests:
              storage: 80Gi

    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2048Mi

    # Tolerations for control-plane
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      value: "true"
      effect: NoSchedule
    # Scrape interval - 30s catches sub-minute spikes; retentionSize/storage doubled to compensate
    scrapeInterval: "30s"
    evaluationInterval: "30s"

    # Alertmanager runs as its own app (operators/alertmanager), not bundled in this chart
    additionalAlertManagerConfigs:
    - scheme: http
      api_version: v2
      static_configs:
      - targets:
        - alertmanager.monitoring.svc:9093

    # Override exporter timestamps to avoid out-of-order sample drops
    overrideHonorTimestamps: true

    # Service monitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # Sluit kubelet-serving-cert-approver uit; kube-system terug toegelaten zodat
    # Cilium/Hubble ServiceMonitors (leven in kube-system) wel gescraped worden
    serviceMonitorNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kubelet-serving-cert-approver

# Alertmanager is deployed separately (operators/alertmanager)
alertmanager:
  enabled: false

defaultRules:
  rules:
    # Selects job="prometheus-alertmanager"; replaced by the rules in operators/alertmanager
    alertmanager: false

# Grafana runs as its own app (operators/grafana). This chart only keeps deploying the
# default dashboards as ConfigMaps (grafana_dashboard=1), which the new Grafana's sidecar picks up.
grafana:
  enabled: false
  forceDeployDashboards: true
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Europe/Amsterdam

# Kubelet - disable probes endpoint, allowlist alleen essentiële cadvisor metrics
# Reduceert series van ~275k naar geschatte ~60-80k
kubelet:
  serviceMonitor:
    probes: false
    cAdvisorMetricRelabelings:
      # Drop hoge-cardinality id-label
      - action: labeldrop
        regex: id
      # Allowlist: behoud alleen essentiële metrics voor alerting/debugging
      - sourceLabels: [__name__]
        regex: >-
          container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|cpu_cfs_throttled_seconds_total|memory_working_set_bytes|memory_usage_bytes|memory_rss|memory_cache|network_receive_bytes_total|network_transmit_bytes_total|network_receive_errors_total|network_transmit_errors_total|fs_usage_bytes|fs_limit_bytes|oom_events_total|start_time_seconds|scrape_error)
        action: keep

# Prometheus Node Exporter
prometheus-node-exporter:
  tolerations:
  - effect: NoSchedule
    operator: Exists
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 64Mi

# Kube State Metrics
kube-state-metrics:
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Equal
    value: "true"
    effect: NoSchedule
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Prometheus Operator, plus the config-reloader sidecar it injects into
# Prometheus and Alertmanager
prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 256Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 64Mi

# etcd metrics - Talos exposes etcd metrics on port 2381
kubeEtcd:
  enabled: true
  endpoints:
  - 10.0.10.130
  - 10.0.10.131
  - 10.0.10.132
  service:
    enabled: true
    port: 2381
    targetPort: 2381
  serviceMonitor:
    enabled: true
    scheme: http
    # insecureSkipVerify removed: scheme is http, TLS is not in use, field had no effect
# kube-controller-manager and kube-scheduler metrics
# On Talos, these bind to 127.0.0.1 by default. We've configured them to bind to 0.0.0.0
# in the Talos machine config. Endpoints are discovered via control-plane node IPs.
kubeControllerManager:
  enabled: false # Niet nuttig voor homelab alerting
kubeScheduler:
  enabled: false # Niet nuttig voor homelab alerting
kubeProxy:
  enabled: false # Using Cilium kube-proxy replacement
