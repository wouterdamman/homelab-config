# kube-prometheus-stack values
# Docs: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

# Global settings
fullnameOverride: prometheus

# Prometheus
prometheus:
  prometheusSpec:
    # Discover ServiceMonitor targets via discovery.k8s.io/v1 EndpointSlice instead
    # of core/v1 Endpoints, which is deprecated since Kubernetes 1.33 (cluster runs
    # 1.36) and made client-go log a deprecation warning on every watch.
    serviceDiscoveryRole: EndpointSlice

    retention: 14d
    # Doubled from 30GB alongside scrapeInterval 60s->30s to keep 14d retention intact
    retentionSize: "60GB"

    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-monitoring
          accessModes: [ "ReadWriteOnce" ]
          resources:
            requests:
              storage: 80Gi

    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2048Mi

    # Tolerations for control-plane
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      value: "true"
      effect: NoSchedule
    # Scrape interval - 30s catches sub-minute spikes; retentionSize/storage doubled to compensate
    scrapeInterval: "30s"
    evaluationInterval: "30s"

    # Alertmanager runs as its own app (operators/alertmanager), not bundled in this chart
    additionalAlertManagerConfigs:
    - scheme: http
      api_version: v2
      static_configs:
      - targets:
        - alertmanager.monitoring.svc:9093

    # Override exporter timestamps to avoid out-of-order sample drops
    overrideHonorTimestamps: true

    # Service monitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # Sluit kubelet-serving-cert-approver uit; kube-system terug toegelaten zodat
    # Cilium/Hubble ServiceMonitors (leven in kube-system) wel gescraped worden
    serviceMonitorNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kubelet-serving-cert-approver

# Alertmanager is deployed separately (operators/alertmanager)
alertmanager:
  enabled: false

defaultRules:
  rules:
    # Selects job="prometheus-alertmanager"; replaced by the rules in operators/alertmanager
    alertmanager: false

# Grafana
grafana:
  enabled: true

  # Admin credentials from ExternalSecret
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

  # Persistence
  persistence:
    enabled: true
    storageClassName: longhorn-standard
    size: 5Gi

  # RWO volume: a rolling update deadlocks (the new pod waits for the volume
  # the old pod still holds), so stop the old pod first.
  deploymentStrategy:
    type: Recreate

  # Resources
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

  # Tolerations
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Equal
    value: "true"
    effect: NoSchedule

  # OIDC credentials injected as env vars; optional so Grafana starts before Authentik is configured
  envFromSecrets:
  - name: grafana-oidc-secret
    optional: true

  # Grafana.ini settings
  grafana.ini:
    server:
      root_url: https://grafana.svc.damman.tech
    auth:
      disable_login_form: false
    auth.anonymous:
      enabled: false
    auth.generic_oauth:
      enabled: true
      name: Authentik
      allow_sign_up: true
      use_pkce: true
      scopes: openid email profile
      auth_url: https://sso.svc.damman.tech/application/o/authorize/
      # token_url + api_url use internal service: svc-gateway LB IP is cluster-entity, blocked by CNP
      token_url: http://authentik-server.authentik.svc.cluster.local/application/o/token/
      api_url: http://authentik-server.authentik.svc.cluster.local/application/o/userinfo/
      signout_redirect_url: https://sso.svc.damman.tech/application/o/grafana/end-session/
      client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      role_attribute_path: "'Admin'"

  # Default dashboards
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Europe/Amsterdam

  # Additional data sources (Loki)
  additionalDataSources:
  - name: Loki
    type: loki
    url: http://loki.monitoring:3100
    access: proxy
    isDefault: false
  # Sidecar for dashboard discovery
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
      # Would point at the removed prometheus-alertmanager service
      alertmanager:
        enabled: false
    # Applies to both the dashboards and datasources sidecar (~90Mi each).
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 192Mi

# Kubelet - disable probes endpoint, allowlist alleen essentiële cadvisor metrics
# Reduceert series van ~275k naar geschatte ~60-80k
kubelet:
  serviceMonitor:
    probes: false
    cAdvisorMetricRelabelings:
      # Drop hoge-cardinality id-label
      - action: labeldrop
        regex: id
      # Allowlist: behoud alleen essentiële metrics voor alerting/debugging
      - sourceLabels: [__name__]
        regex: >-
          container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|cpu_cfs_throttled_seconds_total|memory_working_set_bytes|memory_usage_bytes|memory_rss|memory_cache|network_receive_bytes_total|network_transmit_bytes_total|network_receive_errors_total|network_transmit_errors_total|fs_usage_bytes|fs_limit_bytes|oom_events_total|start_time_seconds|scrape_error)
        action: keep

# Prometheus Node Exporter
prometheus-node-exporter:
  tolerations:
  - effect: NoSchedule
    operator: Exists
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 64Mi

# Kube State Metrics
kube-state-metrics:
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Equal
    value: "true"
    effect: NoSchedule
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Prometheus Operator, plus the config-reloader sidecar it injects into
# Prometheus and Alertmanager
prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 256Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 64Mi

# etcd metrics - Talos exposes etcd metrics on port 2381
kubeEtcd:
  enabled: true
  endpoints:
  - 10.0.10.130
  - 10.0.10.131
  - 10.0.10.132
  service:
    enabled: true
    port: 2381
    targetPort: 2381
  serviceMonitor:
    enabled: true
    scheme: http
    # insecureSkipVerify removed: scheme is http, TLS is not in use, field had no effect
# kube-controller-manager and kube-scheduler metrics
# On Talos, these bind to 127.0.0.1 by default. We've configured them to bind to 0.0.0.0
# in the Talos machine config. Endpoints are discovered via control-plane node IPs.
kubeControllerManager:
  enabled: false # Niet nuttig voor homelab alerting
kubeScheduler:
  enabled: false # Niet nuttig voor homelab alerting
kubeProxy:
  enabled: false # Using Cilium kube-proxy replacement
