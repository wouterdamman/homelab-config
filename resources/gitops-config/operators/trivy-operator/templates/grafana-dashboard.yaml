# Trivy dashboard, picked up by the Grafana dashboard sidecar (folder Trivy):
# - trivy-deep-dive.json: own dashboard on the per-finding info metrics
# Read with .Files so Helm does not parse the legend formats (double curly
# braces) in the JSON.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator-grafana-dashboard
  namespace: trivy-system
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Trivy
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | replace "${DS_PROMETHEUS}" "prometheus" | indent 4 }}
{{- end }}
