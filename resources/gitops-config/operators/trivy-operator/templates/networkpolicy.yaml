apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  # Operator and scan job pods share the namespace
  endpointSelector: {}

  ingress:
  # Prometheus scraping (container port, not service port)
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app.kubernetes.io/name: vmagent
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP

  egress:
  # DNS
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP

  # kube-apiserver: watch workloads, write reports
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP

  # Scan jobs pull the vulnerability DB (mirror.gcr.io, ghcr.io) and the
  # images to scan from registries on the internet
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
