# Trivy Operator: scans running workloads for CVEs, exposed secrets, config
# issues and RBAC problems, and stores the results as *Report CRDs. Metrics
# feed the Grafana dashboard (grafana.com id 17813).

operator:
  # Scan jobs run in this namespace (scanJobsInSameNamespace is false by
  # default, so the operator namespace is used for the job pods).
  # One at a time: every scan job downloads and unpacks the Trivy DB on the
  # node disk, which is the NVMe that etcd shares (see the 2026-10-26 stall).
  scanJobsConcurrentLimit: 1
  scanJobTimeout: 10m
  # Rescan existing images every 3 days instead of daily. New or changed
  # images are still scanned at once; the cost is that a new CVE in an
  # unchanged image shows up to 3 days late.
  scannerReportTTL: "72h"
  # Needed for the dashboard (severity counts per image/resource).
  metricsFindingsEnabled: true
  # The SBOM and compliance reports are large and nothing reads them.
  sbomGenerationEnabled: false
  clusterComplianceEnabled: false
  # Off: the node-collector mounts /etc/systemd as hostPath, which fails on
  # Talos (read-only root, no systemd), so its job never starts.
  infraAssessmentScannerEnabled: false
  # Per-finding info metrics for the deep-dive dashboard (CVE id, check id,
  # title, fixed version). Watch the series count in Prometheus.
  metricsVulnIdEnabled: true
  metricsConfigAuditInfo: true
  metricsRbacAssessmentInfo: true
  metricsExposedSecretInfo: true
  metricsImageInfo: true

serviceMonitor:
  enabled: true
  interval: 60s

resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 512Mi

# PSS restricted for the operator itself
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

trivy:
  # LOW and UNKNOWN are not actionable here and inflate reports and series.
  severity: MEDIUM,HIGH,CRITICAL
  # A CVE without a fix cannot be resolved, so only report fixable ones. The
  # dashboard then reads as a list of images to update.
  ignoreUnfixed: true
  # Scan jobs: one at a time so a scan does not compete with Longhorn/etcd IO
  # on the single host. Trivy memory peaks on big images.
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 1Gi
