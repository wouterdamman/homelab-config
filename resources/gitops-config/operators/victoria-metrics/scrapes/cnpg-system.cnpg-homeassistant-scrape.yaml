# Native version of the PodMonitor cnpg-homeassistant that the app's chart used to
# render; the spec is what the operator's converter made of it (and what has been scraping).
# If a chart upgrade changes the service labels or port names, this object has to follow.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cnpg-homeassistant-scrape
  namespace: cnpg-system
spec:
  namespaceSelector: {}
  podMetricsEndpoints:
    - attach_metadata: {}
      metricRelabelConfigs:
        - action: "replace"
          sourceLabels:
            - "cluster"
          targetLabel: "cnpg_cluster"
      port: "metrics"
  selector:
    matchLabels:
      cnpg.io/cluster: "cnpg-homeassistant"
      cnpg.io/podRole: "instance"
