# Native version of the ServiceMonitor that the emqx chart used to render. The chart's own
# basic-auth Secret went away with metrics.enabled=false, so the dashboard credentials are used.
# The job label is the jobLabel emqx-scraping, as before.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: emqx-emqx-enterprise-scrape
  namespace: emqx
spec:
  endpoints:
    - attach_metadata: {}
      basicAuth:
        password:
          key: "EMQX_DASHBOARD__DEFAULT_PASSWORD"
          name: "emqx-dashboard-secret"
        username:
          key: "EMQX_DASHBOARD__DEFAULT_USERNAME"
          name: "emqx-dashboard-secret"
      interval: "10s"
      params:
        type:
          - "prometheus"
      path: "/api/v5/prometheus/stats"
      port: "dashboard"
      scheme: "http"
  jobLabel: "emqx-scraping"
  namespaceSelector:
    matchNames:
      - "emqx"
  selector:
    matchLabels:
      app.kubernetes.io/name: "emqx-enterprise"
