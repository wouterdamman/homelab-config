# Native version of the ServiceMonitor external-dns-unifi that the app's chart used to
# render; the spec is what the operator's converter made of it (and what has been scraping).
# If a chart upgrade changes the service labels or port names, this object has to follow.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: external-dns-unifi-scrape
  namespace: external-dns
spec:
  endpoints:
    - attach_metadata: {}
      path: "/metrics"
      port: "http"
    - attach_metadata: {}
      path: "/metrics"
      port: "http-webhook"
  jobLabel: "app.kubernetes.io/instance"
  namespaceSelector:
    matchNames:
      - "external-dns"
  selector:
    matchLabels:
      app.kubernetes.io/instance: "external-dns"
      app.kubernetes.io/name: "external-dns"
