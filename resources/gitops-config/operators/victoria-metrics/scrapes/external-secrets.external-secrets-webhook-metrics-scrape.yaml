# Native version of the ServiceMonitor external-secrets-webhook-metrics that the app's chart used to
# render; the spec is what the operator's converter made of it (and what has been scraping).
# If a chart upgrade changes the service labels or port names, this object has to follow.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: external-secrets-webhook-metrics-scrape
  namespace: external-secrets
spec:
  endpoints:
    - attach_metadata: {}
      interval: "30s"
      port: "metrics"
      scrapeTimeout: "25s"
  namespaceSelector:
    matchNames:
      - "external-secrets"
  selector:
    matchLabels:
      app.kubernetes.io/instance: "external-secrets"
      app.kubernetes.io/metrics: "webhook"
      app.kubernetes.io/name: "external-secrets-webhook"
