# Pod scrape: the chart only rendered the metrics Service together with its ServiceMonitor,
# so with the ServiceMonitor switched off the pods are scraped directly. The job label
# is kept at its old value so dashboards and rules keep matching.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: external-secrets-webhook-metrics-scrape
  namespace: external-secrets
spec:
  podMetricsEndpoints:
    - attach_metadata: {}
      honorLabels: false
      interval: "30s"
      path: "/metrics"
      port: "metrics"
      relabelConfigs:
        - action: "replace"
          replacement: "external-secrets-webhook"
          targetLabel: "job"
  namespaceSelector:
    matchNames:
      - "external-secrets"
  selector:
    matchLabels:
      app.kubernetes.io/instance: "external-secrets"
      app.kubernetes.io/name: "external-secrets-webhook"
