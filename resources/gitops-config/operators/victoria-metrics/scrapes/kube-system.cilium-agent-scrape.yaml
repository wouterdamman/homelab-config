# Pod scrape: the chart only rendered the metrics Service together with its ServiceMonitor,
# so with the ServiceMonitor switched off the pods are scraped directly. The job label
# is kept at its old value so dashboards and rules keep matching.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cilium-agent-scrape
  namespace: kube-system
spec:
  podMetricsEndpoints:
    - attach_metadata: {}
      honorLabels: true
      interval: "10s"
      path: "/metrics"
      port: "prometheus"
      relabelConfigs:
        - action: "replace"
          replacement: "cilium-agent"
          targetLabel: "job"
        - action: "replace"
          replacement: "${1}"
          sourceLabels:
            - "__meta_kubernetes_pod_node_name"
          targetLabel: "node"
  namespaceSelector:
    matchNames:
      - "kube-system"
  selector:
    matchLabels:
      k8s-app: "cilium"
  podTargetLabels:
    - "k8s-app"
