# Pod scrape: the chart only rendered the metrics Service together with its ServiceMonitor,
# so with the ServiceMonitor switched off the pods are scraped directly. The job label
# is kept at its old value so dashboards and rules keep matching.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cilium-operator-scrape
  namespace: kube-system
spec:
  podMetricsEndpoints:
    - attach_metadata: {}
      honorLabels: true
      interval: "10s"
      path: "/metrics"
      port: "prometheus"
      relabelConfigs:
        - action: "replace"
          replacement: "cilium-operator"
          targetLabel: "job"
  namespaceSelector:
    matchNames:
      - "kube-system"
  selector:
    matchLabels:
      io.cilium/app: "operator"
      name: "cilium-operator"
  podTargetLabels:
    - "io.cilium/app"
