# Native version of the ServiceMonitor cilium-operator that the app's chart used to
# render; the spec is what the operator's converter made of it (and what has been scraping).
# If a chart upgrade changes the service labels or port names, this object has to follow.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: cilium-operator-scrape
  namespace: kube-system
spec:
  endpoints:
    - attach_metadata: {}
      honorLabels: true
      interval: "10s"
      path: "/metrics"
      port: "metrics"
  namespaceSelector:
    matchNames:
      - "kube-system"
  selector:
    matchLabels:
      io.cilium/app: "operator"
      name: "cilium-operator"
  targetLabels:
    - "io.cilium/app"
