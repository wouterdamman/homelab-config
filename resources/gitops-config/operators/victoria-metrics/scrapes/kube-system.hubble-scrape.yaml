# Native version of the ServiceMonitor hubble that the app's chart used to
# render; the spec is what the operator's converter made of it (and what has been scraping).
# If a chart upgrade changes the service labels or port names, this object has to follow.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: hubble-scrape
  namespace: kube-system
spec:
  endpoints:
    - attach_metadata: {}
      honorLabels: true
      interval: "10s"
      path: "/metrics"
      port: "hubble-metrics"
      relabelConfigs:
        - action: "replace"
          replacement: "${1}"
          sourceLabels:
            - "__meta_kubernetes_pod_node_name"
          targetLabel: "node"
      scheme: "http"
  namespaceSelector:
    matchNames:
      - "kube-system"
  selector:
    matchLabels:
      k8s-app: "hubble"
