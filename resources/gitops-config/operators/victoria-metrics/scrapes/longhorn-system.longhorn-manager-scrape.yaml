# Native version of the ServiceMonitor longhorn-prometheus-servicemonitor that the app's chart used to
# render; the spec is what the operator's converter made of it (and what has been scraping).
# If a chart upgrade changes the service labels or port names, this object has to follow.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: longhorn-manager-scrape
  namespace: longhorn-system
spec:
  endpoints:
    - attach_metadata: {}
      port: "manager"
  namespaceSelector:
    matchNames:
      - "longhorn-system"
  selector:
    matchLabels:
      app: "longhorn-manager"
