# vmagent — scrapes the whole cluster (all ports, driven by VMServiceScrapes) and writes to vmsingle
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmagent
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  ingress:
  # Own metrics, the config-reloader sidecar (8435) and UI access through the API server proxy
  - fromEntities:
    - cluster
    toPorts:
    - ports:
      - port: "8429"
        protocol: TCP
      - port: "8435"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app.kubernetes.io/name: vmsingle
    toPorts:
    - ports:
      - port: "8428"
        protocol: TCP
  # Scraping all pods and node endpoints across the cluster
  - toEntities:
    - cluster
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
---
# vmsingle — metrics storage: receives writes from vmagent, serves queries to vmalert and Grafana
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  ingress:
  # vmagent, vmalert, Grafana and the API server proxy (like the Prometheus policy)
  - fromEntities:
    - cluster
    toPorts:
    - ports:
      - port: "8428"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # vmalert.proxyURL: rules and alerts pages are proxied to vmalert
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app.kubernetes.io/name: vmalert
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
---
# vmalert — evaluates rules against vmsingle
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmalert
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  ingress:
  # Own metrics, the config-reloader sidecar (8435), vmsingle's proxy and UI access
  - fromEntities:
    - cluster
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
      - port: "8435"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app.kubernetes.io/name: vmsingle
    toPorts:
    - ports:
      - port: "8428"
        protocol: TCP
---
# VictoriaMetrics operator — manages the VM custom resources and converts ServiceMonitors
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-metrics-operator
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-operator
  ingress:
  # Admission webhooks from kube-apiserver
  - fromEntities:
    - cluster
    toPorts:
    - ports:
      - port: "9443"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app.kubernetes.io/name: vmagent
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
