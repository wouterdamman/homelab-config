# victoria-metrics-k8s-stack values
# Docs: https://docs.victoriametrics.com/helm/victoria-metrics-k8s-stack/
#
# Alertmanager and Grafana are their own apps (operators/alertmanager, operators/grafana).
# Logs are not part of this app yet.

# Short resource names: vmsingle-vmks, vmagent-vmks, ...
fullnameOverride: vmks

grafana:
  enabled: false
alertmanager:
  enabled: false
defaultDashboards:
  enabled: false
# Dashboards live in operators/grafana/dashboards, the rules in templates/rules.yaml
# (rules/*.yaml). The sync-job would fetch both from GitHub at deploy time.
defaultRules:
  enabled: false
syncJob:
  enabled: false

# Metrics that kube-prometheus-stack used to scrape, now native
kube-state-metrics:
  enabled: true
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Equal
    value: "true"
    effect: NoSchedule
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  enabled: true
  tolerations:
  - effect: NoSchedule
    operator: Exists
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 64Mi

kubelet:
  enabled: true
  vmScrapes:
    # kube-prometheus-stack had the probes endpoint off
    probes:
      enabled: false
    cadvisor:
      spec:
        metricRelabelConfigs:
        # Drop the high-cardinality id label
        - action: labeldrop
          regex: id
        # Allowlist: keep only the essential metrics for alerting and debugging
        - source_labels: [__name__]
          regex: >-
            container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|cpu_cfs_throttled_seconds_total|memory_working_set_bytes|memory_usage_bytes|memory_rss|memory_cache|network_receive_bytes_total|network_transmit_bytes_total|network_receive_errors_total|network_transmit_errors_total|fs_usage_bytes|fs_limit_bytes|oom_events_total|start_time_seconds|scrape_error)
          action: keep

# About 60% of all series came from the API server, nearly all of it latency histograms.
# The drop rule removes the nine biggest ones that no rule or dashboard reads. Helm
# replaces lists, so the chart's endpoint is copied whole.
kubeApiServer:
  enabled: true
  vmScrape:
    spec:
      endpoints:
      - port: https
        scheme: https
        bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
        tlsConfig:
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          serverName: kubernetes
        metricRelabelConfigs:
        - action: drop
          source_labels: [__name__]
          regex: (etcd_request_duration_seconds|apiserver_(watch_events_dispatch_duration_seconds|storage_list_duration_seconds|watch_list_duration_seconds|request_body_size_bytes|watch_cache_read_wait_seconds|watch_cache_initialization_duration_seconds|response_sizes|watch_events_sizes))_bucket

# Talos exposes etcd metrics on plain HTTP port 2381 of the control plane nodes
kubeEtcd:
  enabled: true
  endpoints:
  - 10.0.10.130
  - 10.0.10.131
  - 10.0.10.132
  service:
    port: 2381
    targetPort: 2381
  vmScrape:
    spec:
      endpoints:
      - port: http-metrics
        scheme: http

# The chart names the job core-dns; the CoreDNS dashboard and the existing rules use coredns.
# Helm replaces lists, so the chart's endpoint is copied whole.
coreDns:
  enabled: true
  vmScrape:
    spec:
      endpoints:
      - port: http-metrics
        bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabelConfigs:
        - targetLabel: job
          replacement: coredns

# Not scraped, as before: not useful for the homelab / Cilium replaces kube-proxy
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

vmsingle:
  enabled: true
  spec:
    # Same as Prometheus: 14 days
    retentionPeriod: "14d"
    storage:
      storageClassName: longhorn-monitoring
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 40Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      value: "true"
      effect: NoSchedule

# Logs: VLSingle stores them, vlagent tails every container log (a DaemonSet that reads
# /var/log/pods, hence the privileged namespace) and ships them to VLSingle
vlsingle:
  enabled: true
  spec:
    # Same as Loki: 14 days
    retentionPeriod: "14d"
    extraArgs:
      # Hard cap so a full volume cannot wipe the logs, like the Loki PVC did once
      retention.maxDiskSpaceUsageBytes: 8GiB
    storage:
      storageClassName: longhorn-monitoring
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      value: "true"
      effect: NoSchedule

vlagent:
  enabled: true
  spec:
    k8sCollector:
      enabled: true
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # Run on all nodes including the control plane
    tolerations:
    - effect: NoSchedule
      operator: Exists

vmagent:
  enabled: true
  spec:
    scrapeInterval: 30s
    # The API server response is far above the 16MiB default (histogram buckets);
    # the drop rule for the unused ones comes with the native scrape config
    extraArgs:
      promscrape.maxScrapeSize: 64MiB
      promscrape.streamParse: "true"
    # Same exclusion as the Prometheus ServiceMonitor selection
    serviceScrapeNamespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - kubelet-serving-cert-approver
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      value: "true"
      effect: NoSchedule

vmalert:
  enabled: true
  spec:
    evaluationInterval: 30s
    notifier:
      url: http://alertmanager.monitoring.svc:9093
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      value: "true"
      effect: NoSchedule

victoria-metrics-operator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Equal
    value: "true"
    effect: NoSchedule
